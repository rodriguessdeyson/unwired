# Keep GitHub Pages serving the existing privacy site, independently of the app.
exclude:
  - android
  - src
  - public
  - tools
  - docs
  - examples
  - fastlane
  - node_modules
  - dist
  - AGENTS.md
  - angular.json
  - capacitor.config.ts
  - package.json
  - package-lock.json
  - tsconfig.json
  - tsconfig.app.json
  - tsconfig.spec.json
